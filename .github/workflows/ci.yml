name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # allows posting coverage comment on PRs

jobs:
  motoko-check:
    name: Motoko compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install icp-cli
        run: npm install -g @icp-sdk/icp-cli

      - name: Cache mops packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/mops
          key: mops-${{ runner.os }}-${{ hashFiles('mops.toml') }}

      - name: Install mops
        run: npm install -g ic-mops

      - name: Install Motoko dependencies
        run: mops install

      - name: Initialize mops toolchain (downloads moc)
        run: mops toolchain init

      - name: Pre-warm moc binary
        run: |
          MOC_BIN=$(mops toolchain bin moc 2>/dev/null) || MOC_BIN=""
          if [ -z "$MOC_BIN" ]; then
            rm -rf .mops/_tmp && mops toolchain init
            MOC_BIN=$(mops toolchain bin moc)
          fi
          echo "moc: $MOC_BIN"
          "$MOC_BIN" --version

      - name: Install ic-wasm
        run: |
          TMP=$(mktemp -d)
          curl -sSfL --retry 3 --retry-delay 5 \
            https://github.com/dfinity/ic-wasm/releases/download/0.9.11/ic-wasm-x86_64-unknown-linux-musl.tar.xz \
            -o "$TMP/ic-wasm.tar.xz"
          tar -xJf "$TMP/ic-wasm.tar.xz" -C "$TMP"
          BIN=$(find "$TMP" -name "ic-wasm" -type f | head -1)
          sudo install -m 755 "$BIN" /usr/local/bin/ic-wasm
          rm -rf "$TMP"
          ic-wasm --version

      - name: Start local network (needed for canister ID allocation)
        run: icp network start -d
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Compile all Motoko canisters
        # Parse only the canisters: block — networks:/environments: also have
        # "  - name:" entries which are not canisters.
        run: |
          awk '/^canisters:/{p=1;next} /^[a-z]/{p=0} p && /^  - name:/{print $3}' icp.yaml \
            | grep -v "^frontend$" | grep -v "^internet_identity$" \
            | while read -r canister; do
              echo "=== $canister ==="
              icp build "$canister" || exit 1
            done

  test-backend:
    runs-on: ubuntu-latest
    needs: [motoko-check]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install icp-cli
        run: npm install -g @icp-sdk/icp-cli

      - name: Cache mops packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/mops
          key: mops-${{ runner.os }}-${{ hashFiles('mops.toml') }}

      - name: Install mops
        run: npm install -g ic-mops

      - name: Install Motoko dependencies
        run: mops install

      - name: Initialize mops toolchain
        run: |
          mops toolchain init
          MOC_BIN=$(mops toolchain bin moc 2>/dev/null) || MOC_BIN=""
          if [ -z "$MOC_BIN" ]; then
            rm -rf .mops/_tmp && mops toolchain init
            MOC_BIN=$(mops toolchain bin moc)
          fi
          "$MOC_BIN" --version

      - name: Install ic-wasm
        run: |
          TMP=$(mktemp -d)
          curl -sSfL --retry 3 --retry-delay 5 \
            https://github.com/dfinity/ic-wasm/releases/download/0.9.11/ic-wasm-x86_64-unknown-linux-musl.tar.xz \
            -o "$TMP/ic-wasm.tar.xz"
          tar -xJf "$TMP/ic-wasm.tar.xz" -C "$TMP"
          BIN=$(find "$TMP" -name "ic-wasm" -type f | head -1)
          sudo install -m 755 "$BIN" /usr/local/bin/ic-wasm
          rm -rf "$TMP"

      - name: Start local network
        run: icp network start -d
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Mint cycles and deploy canisters
        run: |
          icp cycles mint 500000000000000 -e local || true
          for canister in listing agent fee; do
            echo "=== deploying $canister ==="
            icp deploy "$canister" -e local
          done

      - name: Wire cross-canister references
        run: |
          LISTING_ID=$(icp canister id listing -e local 2>/dev/null || echo "")
          AGENT_ID=$(icp canister id agent     -e local 2>/dev/null || echo "")
          FEE_ID=$(icp canister id fee         -e local 2>/dev/null || echo "")
          DEPLOYER=$(icp identity principal)

          [ -n "$FEE_ID"   ] && icp canister call listing setFeeCanisterId   "(\"$FEE_ID\")"   -e local
          [ -n "$LISTING_ID" ] && icp canister call fee setListingCanisterId "(\"$LISTING_ID\")" -e local
          [ -n "$AGENT_ID" ] && icp canister call listing setAgentCanisterId "(\"$AGENT_ID\")" -e local

          icp canister call listing addAdmin "(principal \"$DEPLOYER\")" -e local || true
          icp canister call agent   addAdmin "(principal \"$DEPLOYER\")" -e local || true
          icp canister call fee     addAdmin "(principal \"$DEPLOYER\")" -e local || true

      - name: Run backend smoke tests
        run: bash scripts/test-backend.sh

  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Unit tests with coverage
        run: cd frontend && npm run test:unit:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: frontend/coverage/coverage-summary.json
          vite-config-path:  frontend/vite.config.ts

      - name: Build
        run: cd frontend && npm run build

  test-integration:
    runs-on: ubuntu-latest
    # Runs Vitest integration tests against the service layer's !CANISTER_ID
    # mock fallback — no live canisters needed. Tests in
    # frontend/src/__tests__/integration/ inject data via window.__e2e_* globals.
    needs: [motoko-check]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run integration tests
        run: npm run test:integration

  test-e2e:
    runs-on: ubuntu-latest
    # Playwright E2E tests — no live canisters needed. Service layer falls back
    # to in-memory mocks when CANISTER_ID_* env vars are absent. Tests inject
    # data via window.__e2e_* globals through addInitScript.
    needs: [test-frontend]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
